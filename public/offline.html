<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0a">
    <title>Offline · meSync</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #0a0a0a radial-gradient(60% 50% at 50% 30%, rgb(31 173 174 / 0.18), transparent 70%);
            color: #a3a3a3;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center;
        }
        .card {
            max-width: 380px;
            padding: 40px 32px;
            border: 1px solid rgb(255 255 255 / 0.08);
            border-radius: 24px;
            background: rgb(255 255 255 / 0.03);
            backdrop-filter: blur(12px);
        }
        img { width: 72px; height: 72px; }
        h1 { margin: 20px 0 8px; color: #fff; font-size: 22px; letter-spacing: -0.02em; }
        p { margin: 0; font-size: 15px; line-height: 1.55; }
        button {
            margin-top: 28px;
            padding: 11px 22px;
            border: 0;
            border-radius: 12px;
            background: #1fadae;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px -8px rgb(31 173 174 / 0.8);
        }
        button:hover { background: #1a9596; }
    </style>
</head>
<body>
    <main class="card">
        <img src="/images/logo/logo-512x512-dark.png" alt="meSync">
        <h1>Du bist offline</h1>
        <p>meSync braucht eine Internetverbindung. Sobald du wieder online bist, geht’s weiter.</p>
        <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
    <script>
        // Back online: reload automatically
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
